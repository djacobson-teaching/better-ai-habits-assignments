<title>Better AI Habits: Assignment Edition</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Public+Sans:ital,wght@0,400;0,600;0,700;1,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
@property --hl { syntax: '<color>'; inherits: true; initial-value: #FFE14D; }
@property --deep { syntax: '<color>'; inherits: true; initial-value: #7A5E00; }

:root {
  /* Layout: a marked-up handout. A fixed index on the left on every view, one idea per page on the right. Each section has its own highlighter, used only as fill. */
  --bg: #F3F4F1;
  --surface: #FFFFFF;
  --ink: #16181B;
  --ink-2: #5A5F66;
  --line: #DCDFD9;
  --line-2: #BFC4BC;
  --hl-trick: #FFE14D;
  --hl-tip: #9ED8FF;
  --hl-habit: #A8EBA2;
  --deep-trick: #7A5E00;
  --deep-tip: #0A5590;
  --deep-habit: #1C6E31;
  --on-hl: #16181B;
  --flag: #D3393B;
  --amber: #C98A00;
  --ok: #1C8A4A;
  --hl-mix: 100%;
  --scrim: rgba(17, 19, 22, .32);

  --f-display: "Bricolage Grotesque", "Helvetica Neue", Arial, sans-serif;
  --f-body: "Public Sans", "Segoe UI", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;

  --ease: cubic-bezier(.2, .75, .15, 1);
  --ease-io: cubic-bezier(.65, 0, .25, 1);
  --r: 8px;
  --side-w: 280px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111316; --surface: #191C20; --ink: #ECEEEF; --ink-2: #A3A9AF; --line: #2A2F35; --line-2: #3B424A;
    --deep-trick: #FFE14D; --deep-tip: #9ED8FF; --deep-habit: #A8EBA2; --flag: #FF7B72; --amber: #F2C04D; --ok: #5BD38A;
    --hl-mix: 34%; --scrim: rgba(0, 0, 0, .55);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111316; --surface: #191C20; --ink: #ECEEEF; --ink-2: #A3A9AF; --line: #2A2F35; --line-2: #3B424A;
  --deep-trick: #FFE14D; --deep-tip: #9ED8FF; --deep-habit: #A8EBA2; --flag: #FF7B72; --amber: #F2C04D; --ok: #5BD38A;
  --hl-mix: 34%; --scrim: rgba(0, 0, 0, .55);
  color-scheme: dark;
}
[data-chunk="home"] { --hl: var(--hl-trick); --deep: var(--deep-trick); }
[data-chunk="trick"] { --hl: var(--hl-trick); --deep: var(--deep-trick); }
[data-chunk="tip"] { --hl: var(--hl-tip); --deep: var(--deep-tip); }
[data-chunk="habit"] { --hl: var(--hl-habit); --deep: var(--deep-habit); }
[data-chunk="wrap"] { --hl: var(--line-2); --deep: var(--ink); }

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 1.0625rem; line-height: 1.6; }
button, input, textarea, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; border-radius: 3px; }
a { color: inherit; }

.mark {
  background-image: linear-gradient(transparent 54%, color-mix(in srgb, var(--hl) var(--hl-mix), transparent) 54%, color-mix(in srgb, var(--hl) var(--hl-mix), transparent) 94%, transparent 94%);
  background-repeat: no-repeat; background-size: 100% 100%;
  -webkit-box-decoration-break: clone; box-decoration-break: clone; padding: 0 .06em;
}
@keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
@keyframes markIn { to { background-size: 100% 100%; } }
.swap { animation: rise .32s var(--ease) both; }
.k { font-family: var(--f-mono); font-size: .72rem; font-weight: 500; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-2); }

/* ---------- controls ---------- */
.btn { display: inline-flex; align-items: center; gap: .5em; padding: .7em 1.15em; border: 1px solid var(--ink); border-radius: var(--r); background: var(--ink); color: var(--bg); font-weight: 600; cursor: pointer; transition: transform .2s var(--ease); }
.btn:hover { transform: translateY(-1px); }
.btn .arr { display: inline-block; transition: transform .25s var(--ease); }
.btn:hover .arr { transform: translateX(3px); }
.btn.quiet { background: transparent; color: var(--ink); border-color: var(--line-2); }
.row-btns { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.mini { display: inline-flex; align-items: center; gap: 6px; padding: 6px 10px; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); cursor: pointer; font-size: .85rem; color: var(--ink-2); transition: border-color .2s, color .2s; }
.mini:hover { border-color: var(--line-2); color: var(--ink); }
.mini svg { width: 15px; height: 15px; }
.field { display: grid; gap: 6px; min-width: 0; }
.field label { font-size: .85rem; font-weight: 600; color: var(--ink-2); }
.field textarea, .field select { width: 100%; min-width: 0; padding: .6em .75em; border: 1px solid var(--line-2); border-radius: var(--r); background: var(--surface); }
.field textarea { resize: vertical; line-height: 1.5; }
.field textarea:focus, .field select:focus { outline: none; border-color: var(--ink); }

.seg-ctl { position: relative; display: inline-flex; flex-wrap: wrap; gap: 2px; padding: 3px; border: 1px solid var(--line); border-radius: calc(var(--r) + 3px); background: var(--bg); max-width: 100%; }
.seg-ctl .thumb { position: absolute; top: 0; left: 0; border-radius: var(--r); background: var(--surface); border: 1px solid var(--line-2); transition: transform .38s var(--ease), width .38s var(--ease), height .38s var(--ease); pointer-events: none; }
.seg-ctl button { position: relative; z-index: 1; padding: .38em .85em; border: 0; border-radius: var(--r); background: none; cursor: pointer; font-size: .9rem; font-weight: 600; color: var(--ink-2); transition: color .2s; }
.seg-ctl button[aria-selected="true"] { color: var(--ink); }

.prompt { border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); overflow: hidden; min-width: 0; }
.prompt-h { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 7px 8px 7px 14px; border-bottom: 1px solid var(--line); }
.prompt pre { margin: 0; padding: 14px 16px; white-space: pre-wrap; overflow-wrap: anywhere; font-family: var(--f-mono); font-size: .88rem; line-height: 1.7; }
.copy { min-width: 70px; padding: 4px 10px; border: 1px solid var(--line-2); border-radius: var(--r); background: var(--surface); cursor: pointer; font-size: .82rem; font-weight: 600; transition: background-color .25s, border-color .25s, color .25s; }
.copy.done { background: var(--hl); border-color: var(--hl); color: var(--on-hl); }
.reveal { display: grid; grid-template-rows: 0fr; opacity: 0; transition: grid-template-rows .45s var(--ease), opacity .3s var(--ease); }
.reveal > div { overflow: hidden; min-height: 0; }
.reveal.open { grid-template-rows: 1fr; opacity: 1; }
.src { display: flex; flex-wrap: wrap; gap: 4px 14px; margin: 0; padding-top: 12px; border-top: 1px dashed var(--line-2); font-size: .8rem; color: var(--ink-2); }
.src a { text-underline-offset: 3px; text-decoration-color: var(--line-2); }
.src a:hover { color: var(--ink); }

/* ---------- shell ---------- */
.app { display: grid; grid-template-columns: var(--side-w) minmax(0, 1fr); min-height: 100vh; transition: --hl .5s var(--ease-io), --deep .5s var(--ease-io); }
.side { position: sticky; top: 0; height: 100vh; overflow-y: auto; overscroll-behavior: contain; display: flex; flex-direction: column; gap: 18px; padding-block: 22px 18px; padding-left: max(18px, env(safe-area-inset-left, 0px)); padding-right: 16px; background: var(--surface); border-right: 1px solid var(--line); }
.brand { display: grid; gap: 2px; padding: 0; border: 0; background: none; text-align: left; cursor: pointer; }
.brand b { font-family: var(--f-display); font-weight: 800; font-size: 1.4rem; line-height: 1; letter-spacing: -.03em; }
.brand span { font-size: .84rem; color: var(--ink-2); }
.subj-pick { display: grid; gap: 4px; }
.subj-pick select { padding: .45em .6em; border: 1px solid var(--line-2); border-radius: var(--r); background: var(--surface); font-size: .9rem; }
.prog-bar { display: grid; gap: 3px; }
.prog-seg { position: relative; height: 4px; border-radius: 2px; background: var(--line); overflow: hidden; }
.prog-seg i { position: absolute; inset: 0; background: var(--hl); transform-origin: left; transform: scaleX(0); transition: transform .5s var(--ease); }
.navlist { position: relative; display: grid; gap: 16px; }
.marker { position: absolute; left: -8px; right: -6px; top: 0; height: 32px; border-radius: var(--r); pointer-events: none; background: color-mix(in srgb, var(--hl) calc(var(--hl-mix) * .7), transparent); transition: transform .42s var(--ease), height .42s var(--ease); }
.grp { display: grid; }
.grp-h { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 0 0 4px; }
.grp-h b { padding: 1px 7px; border-radius: 4px; background: var(--hl); color: var(--on-hl); font-family: var(--f-mono); font-size: .7rem; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; }
.grp-h span { font-size: .76rem; color: var(--ink-2); }
.nav-i { position: relative; display: grid; grid-template-columns: 2.3ch minmax(0, 1fr); gap: 8px; align-items: baseline; padding: 5px 2px; border: 0; background: none; text-align: left; cursor: pointer; color: var(--ink-2); font-size: .92rem; line-height: 1.3; transition: color .2s; }
.nav-i:hover { color: var(--ink); }
.nav-i[aria-current="page"] { color: var(--ink); font-weight: 600; }
.nav-i .n { font-family: var(--f-mono); font-size: .74rem; }
.nav-i .n svg { width: 13px; height: 13px; vertical-align: -1px; }
.nav-i.disc .t { font-style: italic; }
.side-foot { margin-top: auto; display: flex; gap: 8px; }
.topbar, .scrim { display: none; }
.main { min-width: 0; padding-block: clamp(32px, 6vw, 72px) 64px; padding-left: clamp(24px, 6vw, 88px); padding-right: max(24px, env(safe-area-inset-right, 0px)); }

/* ---------- page ---------- */
.page { max-width: 800px; display: grid; gap: 30px; }
.page.fwd { animation: pageIn .48s var(--ease) both; }
.page.back { animation: pageBack .48s var(--ease) both; }
@keyframes pageIn { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }
@keyframes pageBack { from { opacity: 0; transform: translateY(-16px); } to { opacity: 1; transform: none; } }
.page-h { display: grid; gap: 12px; }
.where { display: flex; align-items: center; gap: 10px; margin: 0; font-size: .86rem; color: var(--ink-2); }
.where .tag { padding: 1px 7px; border-radius: 4px; background: var(--hl); color: var(--on-hl); font-family: var(--f-mono); font-size: .7rem; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; }
.page-t { margin: 0; font-family: var(--f-display); font-weight: 800; font-size: clamp(2.3rem, 5.4vw, 3.9rem); line-height: 1; letter-spacing: -.035em; text-wrap: balance; }
.page-t .mark { background-size: 0% 100%; animation: markIn .75s .12s var(--ease) forwards; }
.claim { margin: 0; font-size: clamp(1.12rem, 2vw, 1.35rem); color: var(--ink-2); max-width: 44ch; }
.body { display: grid; gap: 24px; min-width: 0; }
.sub { margin: 0; font-family: var(--f-display); font-weight: 700; font-size: 1.15rem; letter-spacing: -.01em; }
.card { padding: 18px 20px; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); }
.pager { display: flex; justify-content: space-between; gap: 12px; padding-top: 20px; border-top: 1px solid var(--line); }
.pg { display: grid; gap: 1px; padding: 8px 12px; border: 1px solid transparent; border-radius: var(--r); background: none; cursor: pointer; text-align: left; transition: border-color .2s; }
.pg:hover { border-color: var(--line); }
.pg.next { text-align: right; margin-left: auto; }
.pg small { font-size: .78rem; color: var(--ink-2); }
.pg span { font-weight: 600; font-size: .95rem; }

/* home */
.home h1 { margin: 0; font-family: var(--f-display); font-weight: 800; font-size: clamp(2.8rem, 7vw, 5.6rem); line-height: .94; letter-spacing: -.04em; }
.home h1 .ed { display: block; margin-top: .12em; font-size: .5em; font-weight: 700; letter-spacing: -.02em; }
.home h1 .ed .mark { background-size: 0% 100%; animation: markIn .9s .25s var(--ease) forwards; }
.blurb { margin: 0; font-size: clamp(1.08rem, 1.8vw, 1.22rem); max-width: 54ch; }
.ready { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border-top: 1px solid var(--ink); }
.rd { display: grid; gap: 6px; align-content: start; padding: 16px 16px 4px 0; animation: rise .5s var(--ease) both; animation-delay: calc(var(--i) * 90ms + 200ms); }
.rd + .rd { padding-left: 16px; border-left: 1px solid var(--line); }
.rd h3 { margin: 0; font-family: var(--f-display); font-weight: 700; font-size: 1.15rem; line-height: 1.2; }
.rd ul { margin: 4px 0 0; padding: 0; list-style: none; font-size: .88rem; color: var(--ink-2); display: grid; gap: 2px; }
.rd li.star { color: var(--ink); font-weight: 600; }
@media (max-width: 900px) { .ready { grid-template-columns: repeat(2, minmax(0, 1fr)); } .rd:nth-child(3) { padding-left: 0; border-left: 0; } .rd:nth-child(n+3) { border-top: 1px solid var(--line); } }
@media (max-width: 520px) { .ready { grid-template-columns: 1fr; } .rd + .rd { padding-left: 0; border-left: 0; border-top: 1px solid var(--line); } }
.think-line { margin: 0; font-size: .92rem; color: var(--ink-2); }
.think-line b { color: var(--ink); }

/* #1 scan */
.asg { display: grid; gap: 6px; }
.asg p { margin: 0; font-family: var(--f-display); font-weight: 700; font-size: 1.15rem; line-height: 1.35; letter-spacing: -.01em; }
.scan { display: grid; gap: 0; }
.sr { display: grid; grid-template-columns: minmax(0, 1fr) 150px; gap: 6px 18px; align-items: center; padding: 14px 0; border-top: 1px solid var(--line); animation: rise .45s var(--ease) both; animation-delay: calc(var(--i) * 140ms); }
.sr b { font-weight: 700; }
.sr .fix { grid-column: 1 / -1; display: flex; gap: 8px; align-items: baseline; font-size: .92rem; color: var(--ink-2); }
.sr .fix::before { content: "Fix"; flex: none; font-family: var(--f-mono); font-size: .7rem; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; padding: 0 6px; border-radius: 4px; background: var(--hl); color: var(--on-hl); }
.meter { display: grid; gap: 4px; }
.meter .bar { height: 8px; border-radius: 4px; background: var(--line); overflow: hidden; }
.meter i { display: block; height: 100%; transform-origin: left; transform: scaleX(0); transition: transform .9s var(--ease); }
.meter span { font-family: var(--f-mono); font-size: .72rem; text-align: right; }
.lv-h i { background: var(--flag); } .lv-h span { color: var(--flag); }
.lv-m i { background: var(--amber); } .lv-m span { color: var(--amber); }
.lv-l i { background: var(--ok); } .lv-l span { color: var(--ok); }
@media (max-width: 560px) { .sr { grid-template-columns: 1fr; } }

/* #2 structures */
.lights { display: grid; gap: 10px; }
.light { display: grid; grid-template-columns: 44px minmax(0, 1fr); gap: 14px; align-items: center; padding: 12px 16px; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); cursor: pointer; text-align: left; transition: border-color .25s, transform .2s var(--ease); animation: rise .45s var(--ease) both; animation-delay: calc(var(--i) * 120ms); }
.light:hover { transform: translateX(3px); }
.light .bulb { width: 36px; height: 36px; border-radius: 50%; background: var(--c); opacity: .3; transition: opacity .3s, box-shadow .3s; }
.light[aria-pressed="true"] { border-color: var(--c); }
.light[aria-pressed="true"] .bulb { opacity: 1; box-shadow: 0 0 0 6px color-mix(in srgb, var(--c) 22%, transparent); }
.light b { font-family: var(--f-display); font-size: 1.15rem; }
.light span { display: block; font-size: .92rem; color: var(--ink-2); }
.aias { display: grid; gap: 8px; }
.lvl { display: grid; grid-template-columns: 40px minmax(0, 1fr); gap: 12px; align-items: center; padding: 10px 14px; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); cursor: pointer; text-align: left; margin-left: calc(var(--i) * 14px); transition: border-color .25s, background-color .25s; animation: rise .45s var(--ease) both; animation-delay: calc(var(--i) * 100ms); }
.lvl .num { font-family: var(--f-display); font-weight: 800; font-size: 1.5rem; line-height: 1; color: var(--deep); }
.lvl b { font-weight: 700; } .lvl span { display: block; font-size: .88rem; color: var(--ink-2); }
.lvl[aria-pressed="true"] { border-color: var(--deep); background: color-mix(in srgb, var(--hl) calc(var(--hl-mix) * .45), var(--surface)); }
@media (max-width: 560px) { .lvl { margin-left: 0; } }
.badge-line { display: flex; gap: 12px; align-items: center; padding: 12px 14px; border-radius: var(--r); border: 1.5px dashed var(--line-2); }
.badge-line .dot { flex: none; width: 14px; height: 14px; border-radius: 50%; background: var(--c, var(--deep)); }
.badge-line p { margin: 0; font-weight: 600; }

/* #3 ladder */
.steps3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 26px; }
.st { position: relative; display: grid; gap: 10px; align-content: start; padding: 16px; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); animation: rise .5s var(--ease) both; animation-delay: calc(var(--i) * 180ms); }
.st:not(:last-child)::after { content: "→"; position: absolute; right: -21px; top: 40%; color: var(--ink-2); font-size: 1.1rem; }
.st p { margin: 0; font-family: var(--f-mono); font-size: .86rem; line-height: 1.7; }
.blank { padding: 1px 6px; border-radius: 4px; background: var(--hl); color: var(--on-hl); font-weight: 600; }
.lines-own { display: grid; gap: 14px; padding-top: 6px; }
.lines-own i { height: 1px; background: var(--line-2); }
.st .goal { font-family: var(--f-body); font-size: .9rem; color: var(--ink-2); }
@media (max-width: 720px) { .steps3 { grid-template-columns: 1fr; gap: 12px; } .st::after { display: none; } }

/* #4 chat */
.chat { display: grid; gap: 10px; max-width: 560px; min-height: 240px; align-content: start; }
.msg { max-width: 85%; padding: 10px 14px; border-radius: 14px; font-size: .96rem; line-height: 1.45; animation: rise .4s var(--ease) both; }
.msg small { display: block; margin-bottom: 2px; font-size: .72rem; font-weight: 600; color: var(--ink-2); }
.msg.student { justify-self: end; background: var(--surface); border: 1px solid var(--line); border-bottom-right-radius: 4px; }
.msg.gem { background: color-mix(in srgb, var(--hl) calc(var(--hl-mix) * .5), var(--surface)); border-bottom-left-radius: 4px; }
.typing { display: inline-flex; gap: 4px; padding: 14px 16px; }
.typing i { width: 7px; height: 7px; border-radius: 50%; background: var(--ink-2); animation: blink 1s infinite ease-in-out; }
.typing i:nth-child(2) { animation-delay: .15s; } .typing i:nth-child(3) { animation-delay: .3s; }
@keyframes blink { 0%, 80%, 100% { opacity: .25; } 40% { opacity: 1; } }

/* icon cards */
.opts { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.opt { display: grid; gap: 8px; align-content: start; padding: 18px; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); text-align: left; cursor: pointer; transition: background-color .3s, border-color .3s, transform .2s var(--ease); animation: rise .45s var(--ease) both; animation-delay: calc(var(--i) * 110ms); }
.opt:hover { transform: translateY(-2px); }
.opt svg { width: 32px; height: 32px; color: var(--deep); }
.opt b { font-family: var(--f-display); font-weight: 800; font-size: 1.3rem; letter-spacing: -.02em; }
.opt span { font-size: .9rem; color: var(--ink-2); }
.opt[aria-pressed="true"] { background: var(--hl); border-color: var(--hl); color: var(--on-hl); }
.opt[aria-pressed="true"] span, .opt[aria-pressed="true"] svg { color: var(--on-hl); }
@media (max-width: 640px) { .opts { grid-template-columns: 1fr; } }

/* #6 slop */
.slop { margin: 0; font-size: clamp(1.05rem, 2vw, 1.2rem); line-height: 1.9; }
.sm { background-image: linear-gradient(color-mix(in srgb, var(--flag) 22%, transparent), color-mix(in srgb, var(--flag) 22%, transparent)); background-repeat: no-repeat; background-size: 0% 100%; transition: background-size .55s var(--ease); transition-delay: var(--d, 0ms); -webkit-box-decoration-break: clone; box-decoration-break: clone; }
.slop.on .sm { background-size: 100% 100%; }
.tagp { display: inline-block; margin: 0 .3em; padding: 0 6px; border-radius: 4px; background: var(--flag); color: #fff; font-family: var(--f-mono); font-size: .68rem; font-weight: 600; line-height: 1.6; vertical-align: .15em; opacity: 0; transform: scale(.85); transition: opacity .3s, transform .35s var(--ease); transition-delay: calc(var(--d, 0ms) + 350ms); }
.slop.on .tagp { opacity: 1; transform: none; }
.tells { margin: 0; padding: 0; list-style: none; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0 24px; }

        const CARDS = [["Mitochondria", "Where the cell makes most of its energy"], ["Osmosis", "Water moving across a membrane toward more solute"], ["Enzyme", "A protein that speeds up a reaction"], ["Catalyst", "Something that speeds up a reaction without being used up"], ["Diffusion", "Particles spreading from high to low concentration"]];
        const loop = root.querySelector("#loop"), lp = root.querySelector("#loopP");
        const card = (shuffle) => `<button class="flash" type="button" id="flash" aria-label="Flip the card"><span class="flash-in"><span class="face front" id="fF"></span><span class="face back" id="fB"></span></span></button>
          <div class="flash-ctl"><span id="fC"></span>${shuffle ? '<button class="mini" type="button" id="fS">Shuffle</button>' : ""}</div>`;
        const STEPS = [
          () => `<p class="ask">Make flashcards for my bio vocab words. Flip a card when I tap it.</p><p class="loop-note">The student describes what they want in plain words.</p>`,
          () => card(false) + `<p class="loop-note">AI writes the code. Tap the card to flip it.</p>`,
          () => card(false) + `<p class="loop-note bug">Testing it: the cards always come up in the same order, so it's easy to memorize the order instead of the words.</p>`,
          () => `<p class="ask">The cards always show in the same order. Add a shuffle button.</p>` + card(true) + `<p class="loop-note">The student found the problem and fixed it. Try the shuffle.</p>`
        ];
        let order = CARDS.map((_, i) => i), at = 0;
        const paintCard = () => { const [f, b] = CARDS[order[at]]; const F = lp.querySelector("#fF"); if (!F) return; F.textContent = f; lp.querySelector("#fB").textContent = b; lp.querySelector("#fC").textContent = `Card ${at + 1} of ${CARDS.length}`; };
        const step = (n) => {
          S.loop = n; loop.querySelectorAll("button").forEach((b) => b.setAttribute("aria-current", String(+b.dataset.s === n)));
          lp.innerHTML = `<div class="swap" style="display:grid;gap:10px">${STEPS[n]()}</div>`;
          const fl = lp.querySelector("#flash");
          if (fl) { fl.addEventListener("click", () => fl.classList.toggle("flipped")); at = 0; if (n < 3) order = CARDS.map((_, i) => i); paintCard(); }
          const sh = lp.querySelector("#fS");
          if (sh) sh.addEventListener("click", () => {
            const go = () => { for (let i = order.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [order[i], order[j]] = [order[j], order[i]]; } at = 0; paintCard(); fl.classList.remove("swapped"); void fl.offsetWidth; fl.classList.add("swapped"); };
            if (fl.classList.contains("flipped")) { fl.classList.remove("flipped"); setTimeout(go, reduced() ? 0 : 300); } else go();
          });
        };
        loop.querySelectorAll("button").forEach((b) => b.addEventListener("click", () => step(+b.dataset.s)));
        step(S.loop || 0);
        const D = [["Interest in the work", 14], ["Pay and jobs", 11], ["Family influence", 8], ["Helping people", 7]], hb = root.querySelector("#hbars");
        hb.innerHTML = D.map(([l, v], i) => `<div class="hb"><span>${esc(l)}</span><span class="bar" style="transition-delay:${i * 120}ms" data-s="${v / 14}"></span><span class="v">${v}</span></div>`).join("");
        later(() => hb.querySelectorAll(".bar").forEach((b) => { b.style.transform = `scaleX(${b.dataset.s})`; }), 400);
      }
    },
    { id: "discuss-habits", chunk: "habit", discuss: true, q: "Which habit do you think is most important, and why?" },
    { id: "wrap", chunk: "wrap", title: "That's the fifteen", claim: "This page stays up. Come back to any of it from the index." }
  ];

  let count = 0;
  PAGES.forEach((p) => { if (!p.discuss && !p.home && p.chunk !== "wrap") p.num = ++count; });
  const MOVES = count;
  const movesIn = (ch) => PAGES.filter((p) => p.chunk === ch && !p.discuss);
  const idxOf = (id) => PAGES.findIndex((p) => p.id === id);
  const titleOf = (id) => PAGES[idxOf(id)].title;

  /* ---------- helpers ---------- */
  function copyText(text, btn) {
    const label = btn.textContent;
    const done = () => { btn.textContent = "Copied"; btn.classList.add("done"); setTimeout(() => { btn.textContent = label; btn.classList.remove("done"); }, 1500); };
    const fallback = () => { const ta = document.createElement("textarea"); ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0"; document.body.appendChild(ta); ta.select(); let ok = false; try { ok = document.execCommand("copy"); } catch (e) {} ta.remove(); if (ok) done(); else btn.textContent = "Select and copy"; };
    try { if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done, fallback); else fallback(); } catch (e) { fallback(); }
  }
  function setupSeg(ctl, current, onChange) {
    const thumb = ctl.querySelector(".thumb");
    const place = () => { const on = ctl.querySelector('button[aria-selected="true"]'); if (!on) return; thumb.style.width = on.offsetWidth + "px"; thumb.style.height = on.offsetHeight + "px"; thumb.style.transform = `translate(${on.offsetLeft}px, ${on.offsetTop}px)`; };
    ctl.querySelectorAll("button").forEach((b) => {
      b.setAttribute("aria-selected", String(b.dataset.k === current));
      b.addEventListener("click", () => { if (b.getAttribute("aria-selected") === "true") return; ctl.querySelectorAll("button").forEach((x) => x.setAttribute("aria-selected", String(x === b))); place(); onChange(b.dataset.k); });
    });
    thumb.style.transition = "none"; place();
    requestAnimationFrame(() => { place(); requestAnimationFrame(() => { thumb.style.transition = ""; }); });
    ctl._place = place;
  }

  /* ---------- theme ---------- */
  const root = document.documentElement, sysDark = window.matchMedia("(prefers-color-scheme: dark)");
  const theme = () => root.dataset.theme || (sysDark.matches ? "dark" : "light");
  const SUN = '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><circle cx="8" cy="8" r="3"/><path d="M8 1.5v1.8M8 12.7v1.8M1.5 8h1.8M12.7 8h1.8M3.4 3.4l1.3 1.3M11.3 11.3l1.3 1.3M3.4 12.6l1.3-1.3M11.3 4.7l1.3-1.3"/></svg>';
  const MOON = '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M13.3 9.6A5.5 5.5 0 0 1 6.4 2.7a5.5 5.5 0 1 0 6.9 6.9z" stroke-linejoin="round"/></svg>';
  const paintTheme = () => { const d = theme() === "dark"; document.querySelectorAll(".theme-btn").forEach((b) => { b.innerHTML = (d ? SUN : MOON) + `<span>${d ? "Light mode" : "Dark mode"}</span>`; }); };
  try { const t = localStorage.getItem(STORE_KEY + "-theme"); if (t === "dark" || t === "light") root.dataset.theme = t; } catch (e) {}
  document.addEventListener("click", (e) => {
    const b = e.target.closest(".theme-btn"); if (!b) return;
    const t = theme() === "dark" ? "light" : "dark", r = b.getBoundingClientRect();
    const apply = () => { root.dataset.theme = t; try { localStorage.setItem(STORE_KEY + "-theme", t); } catch (e2) {} paintTheme(); };
    if (!document.startViewTransition || reduced()) { apply(); return; }
    root.style.setProperty("--tx", (r.left + r.width / 2) + "px"); root.style.setProperty("--ty", (r.top + r.height / 2) + "px");
    root.classList.add("theme-vt"); document.startViewTransition(apply).finished.finally(() => root.classList.remove("theme-vt"));
  });
  if (sysDark.addEventListener) sysDark.addEventListener("change", paintTheme);

  /* ---------- index ---------- */
  const app = document.getElementById("app"), navlist = document.getElementById("navlist"), progBar = document.getElementById("progBar"), main = document.getElementById("main");
  const subjSel = document.getElementById("subjSel");
  subjSel.innerHTML = SUBJECTS.map(([k, l]) => `<option value="${k}">${l}</option>`).join("");
  subjSel.value = S.subj;
  subjSel.addEventListener("change", () => setSubj(subjSel.value));
  function setSubj(k) { if (S.subj === k) return; S.subj = k; subjSel.value = k; save(); if (PAGES[S.idx].subj || PAGES[S.idx].home) rerender(); }

  function buildNav() {
    let h = '<span class="marker" id="marker" aria-hidden="true"></span>';
    h += `<button class="nav-i" type="button" data-i="0"><span class="n">··</span><span class="t">Start here</span></button>`;
    Object.keys(CHUNKS).forEach((ch) => {
      h += `<div class="grp" data-chunk="${ch}"><p class="grp-h"><b>${CHUNKS[ch].label}</b><span>${CHUNKS[ch].sub}</span></p>`;
      PAGES.forEach((p, i) => { if (p.chunk !== ch) return; h += p.discuss ? `<button class="nav-i disc" type="button" data-i="${i}"><span class="n">${CHAT}</span><span class="t">Discussion</span></button>` : `<button class="nav-i" type="button" data-i="${i}"><span class="n">${pad(p.num)}</span><span class="t">${esc(p.title)}</span></button>`; });
      h += "</div>";
    });
    h += `<button class="nav-i" type="button" data-i="${idxOf("wrap")}"><span class="n">··</span><span class="t">Wrap-up</span></button>`;
    navlist.innerHTML = h;
    navlist.addEventListener("click", (e) => { const b = e.target.closest(".nav-i"); if (b) { goTo(+b.dataset.i); closeNav(); } });
    progBar.style.gridTemplateColumns = Object.keys(CHUNKS).map((ch) => PAGES.filter((p) => p.chunk === ch).length + "fr").join(" ");
    progBar.innerHTML = Object.keys(CHUNKS).map((ch) => `<span class="prog-seg" data-chunk="${ch}"><i></i></span>`).join("");
  }
  function placeMarker(instant) {
    const m = document.getElementById("marker"), a = navlist.querySelector('.nav-i[aria-current="page"]'); if (!m || !a) return;
    if (instant) m.style.transition = "none";
    m.style.height = a.offsetHeight + "px"; m.style.transform = `translateY(${a.offsetTop}px)`;
    if (instant) requestAnimationFrame(() => requestAnimationFrame(() => { m.style.transition = ""; }));
  }

  /* ---------- render ---------- */
  function homeHTML() {
    const D4 = [
      ["Delegation", "Knowing when AI belongs", ["copying", "partner"], '<path d="M5 16h14M14 11l5 5-5 5"/><path d="M27 16H13" opacity=".35"/><circle cx="25" cy="16" r="3"/>'],
      ["Description", "Asking for what they need", ["starter-prompts", "with-students"], '<path d="M5 7h22v14H14l-6 5v-5H5z"/><path d="M10 12h12M10 16h8"/>'],
      ["Discernment", "Checking what comes back", ["check-step", "slop"], '<circle cx="14" cy="14" r="8"/><path d="M20 20l7 7"/><path d="M10 14l3 3 5-6"/>'],
      ["Diligence", "Owning their use", ["sop", "document"], '<path d="M16 4l10 4v8c0 6-4 10-10 12C10 26 6 22 6 16V8z"/><path d="M11 16l4 4 6-7"/>']
    ];
    const secs = Object.keys(CHUNKS).map((ch, i) => `<div class="sec" data-chunk="${ch}" style="--i:${i}"><span class="sec-bar"><i></i></span><b>${CHUNKS[ch].label}</b><span>${movesIn(ch).length} · ${CHUNKS[ch].sub.toLowerCase()}</span></div>`).join("");
    return `<div class="home">
      <div class="hero">
        <h1>Better AI Habits<span class="ed"><span class="mark">Assignment Edition</span></span></h1>
        <p class="blurb">Design assignments that get students ready to use AI well and keep them doing the thinking.</p>
      </div>
      <div class="secs">${secs}</div>
      <div class="top-pick">
        <div class="tp-body">
          <span class="k">My #1 readiness skill</span>
          <h2>Students coding with AI</h2>
          <p>They describe it, AI builds it, they test it and fix it.</p>
        </div>
        <svg class="tp-loop" viewBox="0 0 220 220" aria-hidden="true">
          <circle class="tp-ring" cx="110" cy="110" r="76"/>
          ${[["Describe", 110, 34], ["Build", 186, 110], ["Test", 110, 186], ["Fix", 34, 110]].map(([t, x, y], i) => `<g class="tp-node" style="--i:${i}"><circle cx="${x}" cy="${y}" r="27"/><text x="${x}" y="${y + 4}" text-anchor="middle">${t}</text></g>`).join("")}
        </svg>
      </div>
      <div class="d4-wrap">
        <span class="k">Where students get ready</span>
        <div class="d4">${D4.map(([d, h, ids, ic], i) => `<div class="d4-c" style="--i:${i}"><svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ic}</svg><b>${d}</b><span>${h}</span><small>${ids.map((id) => esc(titleOf(id))).join(" · ")}</small></div>`).join("")}</div>
      </div>
      <div class="home-go">
        <div style="display:grid;gap:8px"><span class="k">Your subject</span>${subjTabs()}</div>
        <button class="btn" type="button" data-step="1">Start <span class="arr" aria-hidden="true">→</span></button>
      </div>
    </div>`;
  }
  function where(p) {
    if (p.chunk === "wrap") return `<p class="where"><span class="tag">Wrap-up</span></p>`;
    if (p.discuss) return `<p class="where"><span class="tag">${CHUNKS[p.chunk].label}</span><span>Section discussion</span></p>`;
    const list = movesIn(p.chunk);
    return `<p class="where"><span class="tag">${CHUNKS[p.chunk].one}</span><span>${list.indexOf(p) + 1} of ${list.length}</span></p>`;
  }
  function bodyHTML(p) {
    if (p.discuss) return `<p class="dq">${esc(p.q)}</p><p class="how">Answer in the chat or unmute.</p><ol class="recap">${movesIn(p.chunk).map((m, k) => `<li style="--i:${k}"><span class="n">${pad(m.num)}</span><span>${esc(m.title)}</span></li>`).join("")}</ol>`;
    if (p.chunk === "wrap") return `<div class="wrap-cols">${Object.keys(CHUNKS).map((ch) => `<div data-chunk="${ch}"><h3><span>${CHUNKS[ch].label}</span></h3><ul>${movesIn(ch).map((m) => `<li>${esc(m.title)}</li>`).join("")}</ul></div>`).join("")}</div>${FEEDBACK_URL ? `<div class="row-btns"><a class="btn" href="${esc(FEEDBACK_URL)}" target="_blank" rel="noopener">Feedback form</a></div>` : ""}`;
    return (p.subj ? subjTabs() : "") + p.html();
  }
  const navLabel = (x) => x.home ? "Start here" : x.discuss ? `${CHUNKS[x.chunk].label} discussion` : x.title;
  function render(i, dir) {
    S.idx = i;
    const p = PAGES[i], prev = PAGES[i - 1], next = PAGES[i + 1];
    app.dataset.chunk = p.chunk;
    const pager = `<nav class="pager" aria-label="Previous and next">${prev ? `<button class="pg" type="button" data-step="-1"><small>← Previous</small><span>${esc(navLabel(prev))}</span></button>` : ""}${next ? `<button class="pg next" type="button" data-step="1"><small>Next →</small><span>${esc(navLabel(next))}</span></button>` : ""}</nav>`;
    main.innerHTML = p.home
      ? `<article class="page ${dir > 0 ? "fwd" : dir < 0 ? "back" : ""}">${homeHTML()}</article>`
      : `<article class="page ${dir > 0 ? "fwd" : dir < 0 ? "back" : ""}">
          <header class="page-h">${where(p)}<h2 class="page-t"><span class="mark">${p.discuss ? "Talk it through" : esc(p.title)}</span></h2><p class="claim">${p.discuss ? `${CHUNKS[p.chunk].label}: ${CHUNKS[p.chunk].sub.toLowerCase()}.` : esc(p.claim)}</p></header>
          <div class="body">${bodyHTML(p)}</div>${pager}</article>`;
    const art = main.firstElementChild;
    art.querySelectorAll("[data-copy]").forEach((b) => b.addEventListener("click", () => { const t = document.getElementById(b.dataset.copy); if (t) copyText(t.textContent, b); }));
    art.querySelectorAll("[data-subj]").forEach((c) => setupSeg(c, S.subj, (k) => setSubj(k)));
    if (p.mount) p.mount(art);
    art.querySelectorAll("[data-step]").forEach((b) => b.addEventListener("click", () => goTo(S.idx + +b.dataset.step)));
    navlist.querySelectorAll(".nav-i").forEach((b) => { if (+b.dataset.i === i) b.setAttribute("aria-current", "page"); else b.removeAttribute("aria-current"); });
    placeMarker(dir === 0);
    const cur = navlist.querySelector('.nav-i[aria-current="page"]'); if (cur && window.innerWidth > 900) cur.scrollIntoView({ block: "nearest" });
    Object.keys(CHUNKS).forEach((ch) => { const own = PAGES.map((q, k) => [q, k]).filter(([q]) => q.chunk === ch), done = own.filter(([, k]) => k <= i).length; progBar.querySelector(`.prog-seg[data-chunk="${ch}"] i`).style.transform = `scaleX(${done / own.length})`; });
    try { history.replaceState(null, "", p.home ? location.pathname + location.search : "#" + p.id); } catch (e) {}
  }
  function rerender() { const y = window.scrollY; render(S.idx, 0); window.scrollTo(0, y); }
  function goTo(i) { if (i < 0 || i >= PAGES.length || i === S.idx) return; render(i, reduced() ? 0 : (i > S.idx ? 1 : -1)); window.scrollTo({ top: 0, behavior: "auto" }); main.focus({ preventScroll: true }); }

  /* ---------- drawer + keys ---------- */
  const navOpen = document.getElementById("navOpen");
  function closeNav() { app.classList.remove("nav-open"); navOpen.setAttribute("aria-expanded", "false"); navOpen.textContent = "Contents"; }
  navOpen.addEventListener("click", () => { const o = !app.classList.contains("nav-open"); app.classList.toggle("nav-open", o); navOpen.setAttribute("aria-expanded", String(o)); navOpen.textContent = o ? "Close" : "Contents"; if (o) requestAnimationFrame(() => placeMarker(true)); });
  document.getElementById("scrim").addEventListener("click", closeNav);
  document.getElementById("homeBtn").addEventListener("click", () => { goTo(0); closeNav(); });
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape") { closeNav(); return; }
    const tag = (e.target.tagName || "").toLowerCase();
    if (tag === "input" || tag === "textarea" || tag === "select" || e.metaKey || e.ctrlKey || e.altKey) return;
    if (e.key === "ArrowRight") { e.preventDefault(); goTo(S.idx + 1); }
    if (e.key === "ArrowLeft") { e.preventDefault(); goTo(S.idx - 1); }
  });
  let rt = 0;
  window.addEventListener("resize", () => { clearTimeout(rt); rt = setTimeout(() => { placeMarker(true); main.querySelectorAll(".seg-ctl").forEach((c) => c._place && c._place()); }, 120); });

  /* ---------- boot ---------- */
  buildNav(); paintTheme();
  const start = idxOf((location.hash || "").slice(1));
  S.idx = -1; render(start >= 0 ? start : 0, 0);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { placeMarker(true); main.querySelectorAll(".seg-ctl").forEach((c) => c._place && c._place()); });
})();
</script>
